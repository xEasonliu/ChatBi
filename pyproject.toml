[project]
name = "chatbi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "eason", email = "123@163.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.136.0",
    "langchain-chroma>=1.1.0",
    "langchain-openai>=1.6.0",
    "openai>=2.38.0",
    "pydantic>=2.11.0",
    "pymysql>=1.2.0",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.35.0",
]

[project.scripts]
chatbi = "chatbi:main"


[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
